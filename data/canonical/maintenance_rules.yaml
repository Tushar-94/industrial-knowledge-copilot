
maintenance_rules:

  # MX-200

  - rule_id: MR-MX200-HRF-INSPECT

    model_id: MX-200

    component_id: HYD_RETURN_FILTER

    maintenance_action: inspect

    interval_operating_hours: 500

    interval_months: null

    condition_trigger: differential_pressure_bar >= 1.0

    severity_if_overdue: medium

    related_procedure_id: SOP-MNT-001

  - rule_id: MR-MX200-HRF-REPLACE

    model_id: MX-200

    component_id: HYD_RETURN_FILTER

    maintenance_action: replace

    interval_operating_hours: 1000

    interval_months: 12

    condition_trigger: differential_pressure_bar >= 1.5

    severity_if_overdue: high

    related_procedure_id: SOP-MNT-002

  - rule_id: MR-MX200-OIL-SAMPLE

    model_id: MX-200

    component_id: HYD_OIL

    maintenance_action: sample

    interval_operating_hours: 1000

    interval_months: 12

    condition_trigger: null

    severity_if_overdue: medium

    related_procedure_id: SOP-MNT-001

  - rule_id: MR-MX200-OIL-REPLACE

    model_id: MX-200

    component_id: HYD_OIL

    maintenance_action: replace

    interval_operating_hours: 4000

    interval_months: 36

    condition_trigger: oil_analysis_out_of_specification

    severity_if_overdue: high

    related_procedure_id: SOP-MNT-001

  - rule_id: MR-MX200-PUMP-INSPECT

    model_id: MX-200

    component_id: HYD_PUMP

    maintenance_action: performance_inspection

    interval_operating_hours: 2000

    interval_months: 24

    condition_trigger: abnormal_noise_or_pressure_instability

    severity_if_overdue: high

    related_procedure_id: SOP-MNT-001

  - rule_id: MR-MX200-SENSOR-CAL

    model_id: MX-200

    component_id: HYD_PRESSURE_SENSOR

