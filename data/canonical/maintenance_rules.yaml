    interval_operating_hours: 1000

    interval_months: 12

    condition_trigger: oil_temperature_c >= 70

    severity_if_overdue: medium

    related_procedure_id: SOP-MNT-001

  - rule_id: MR-MX200-LIGHT-CURTAIN

    model_id: MX-200

    component_id: SAFE_LIGHT_CURTAIN

