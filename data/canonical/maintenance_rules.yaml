    interval_operating_hours: 2000

    interval_months: 24

    condition_trigger: sensor_deviation_bar > 3

    severity_if_overdue: high

    related_procedure_id: SOP-MNT-003

  - rule_id: MR-MX200-RELIEF-INSPECT

