
[build-system]

requires = ["setuptools>=75"]

build-backend = "setuptools.build_meta"

[project]

name = "industrial-knowledge-copilot"

version = "0.1.0"

description = "An evaluation-driven RAG and agentic AI system for technical operations knowledge."

readme = "README.md"

requires-python = ">=3.11,<3.14"

authors = [

    { name = "Tushar Rao" }

]

dependencies = [

    "numpy>=2.0,<3.0",

    "sentence-transformers>=5.0,<6.0",

]

[project.optional-dependencies]

dev = [

    "pytest>=8.0,<9.0",

]

[tool.setuptools.packages.find]

where = ["src"]

